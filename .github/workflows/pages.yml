name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Pin the reviewed adapter source until its next npm release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: owebeeone/grip-vue
          ref: 9a14eae84e90e830cc5a5bed47ee1f84f5e5003e
          path: .pages-adapter
          persist-credentials: false
      - name: Build and verify the pinned adapter
        working-directory: .pages-adapter
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the pinned adapter for the demo
        run: npm install --no-save --package-lock=false --ignore-scripts "$RUNNER_TEMP/owebeeone-grip-vue-0.3.0.tgz"
      - run: npm run check:source
      - run: npm run check:readme
      - run: npm test
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
